slug: temporal-durable-ai-agents-modules
id: ""
title: Building Durable AI Agents
teaser: Four modules from a bare agent to one that survives an outage. OpenAI Agents SDK, MCP, and Temporal.
description: |-
  Most AI agents fall apart the first time something goes wrong. A tool call
  fails, an API times out, a long-running loop loses its place.

  You build an agent with the OpenAI Agents SDK running inside a Temporal
  workflow, give it tools, connect it to an MCP server, then take the network
  away mid-run and watch it pick up where it stopped.

  Each module adds exactly one thing, so you can see before and after in the
  Temporal Web UI.
